<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CocoCo Redirect</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #00aaff; /* sama dengan background gambar */
        }
        img {
            max-width: 80%;
            height: auto;
        }
    </style>
    <script>
        // Redirect ke aplikasi CocoCo
        window.onload = function() {
            // Redirect ke coco.co://
            window.location.href = "coco.co://";
            
        }
    </script>
</head>
<body>
    <img src="horizontal.png" alt="CocoCo Logo">
</body>
</html>
